spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  application:
    name: nyaya-setu
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/nyaya_setu_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Satyam@1234!}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:satyamz6695@gmail.com}
    password: ${SMTP_PASSWORD:btnx uqkl tukk ezkm}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${SMTP_TIMEOUT:5000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT:5000}
  thymeleaf:
    cache: ${SPRING_THYMELEAF_CACHE:false}
  devtools:
    restart:
      enabled: ${SPRING_DEVTOOLS_RESTART:true}
    livereload:
      enabled: ${SPRING_DEVTOOLS_LIVERELOAD:true}
  web:
    resources:
      chain:
        cache: ${SPRING_RESOURCES_CHAIN_CACHE:false}
      cache:
        period: ${SPRING_RESOURCES_CACHE_PERIOD:0}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 21MB

server:
  port: ${SERVER_PORT:${PORT:8080}}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  mail:
    from: ${SMTP_FROM:${SMTP_USERNAME:satyamz6695@gmail.com}}
